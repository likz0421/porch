name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v），如 1.1.0'
        required: true
        default: '1.1.0'

permissions:
  contents: write

jobs:
  test:
    name: 单元测试与规范检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$unformatted" ]; then
            echo "以下文件需要 gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1 -cover

  build:
    name: 交叉编译与打包
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: 版本号
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ver=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建全部平台 + 组装 ipk/zip/校验和
        run: sh scripts/package-release.sh "${{ steps.v.outputs.ver }}"

      # OpenWrt 25.12 起包管理器换成 apk，包格式也换成 apk-tools v3 的 ADB 容器。
      # 没有现成发行版提供 apk-tools 3 的可执行文件，这里取 Alpine 的静态版。
      - name: 准备 apk-tools 3（打 OpenWrt ≥25.12 的 .apk）
        run: sh scripts/install-apk-tools.sh "$RUNNER_TEMP/aptools"

      - name: 构建 OpenWrt apk 包
        run: |
          set -e
          sudo -E env "APK_BIN=$RUNNER_TEMP/aptools/apk" \
            sh scripts/build-apks.sh "${{ steps.v.outputs.ver }}"
          python3 scripts/make_assets.py --version "${{ steps.v.outputs.ver }}" \
            --dist dist --root . --sums-only

      - name: 产物自检
        run: |
          set -e
          n_tar=$(ls -1 dist/*.tar.gz | wc -l)
          n_zip=$(ls -1 dist/*.zip | wc -l)
          n_ipk=$(ls -1 dist/*.ipk | wc -l)
          n_apk=$(ls -1 dist/*.apk | wc -l)
          echo "tar.gz=$n_tar zip=$n_zip ipk=$n_ipk apk=$n_apk"
          [ "$n_tar" -ge 19 ] || { echo "缺少 tar.gz 资产"; exit 1; }
          [ "$n_zip" -ge 2 ]  || { echo "缺少 Windows zip"; exit 1; }
          [ "$n_ipk" -ge 12 ] || { echo "缺少 ipk 资产"; exit 1; }
          [ "$n_apk" -ge 12 ] || { echo "缺少 apk 资产"; exit 1; }
          cd dist
          sha256sum -c SHA256SUMS --quiet && echo "校验和全部通过"
          # Windows 包里必须是 porch.exe，不能是裸 porch
          unzip -l porch_*_windows_x86_64.zip | grep -q 'porch.exe'

      - name: ipk 结构自检
        run: python3 scripts/verify_ipk.py dist/*.ipk

      - name: apk 结构自检（ADB magic + adbdump 解析）
        run: |
          set -e
          APK="$RUNNER_TEMP/aptools/apk"
          for f in dist/*.apk; do
            echo "== $f"
            magic=$(head -c 3 "$f")
            comp=$(dd if="$f" bs=1 skip=3 count=1 2>/dev/null | tr -d '\0')
            echo "   magic=$magic 压缩标记=$comp size=$(wc -c <"$f")"
            # apk v3 容器头固定是 "ADB" + 1 字节压缩标记（'.' 不压 / 'd' deflate / 'c' 自定义）
            [ "$magic" = "ADB" ] || { echo "不是 apk v3（ADB）容器: $f"; exit 1; }
            case "$comp" in .|d|c) ;; *) echo "压缩标记异常: $comp"; exit 1 ;; esac
            # adbdump 是 apk-tools 的调试 applet，解析成功就说明容器结构合法；
            # 它属于未文档化命令，万一这个版本没有就只告警——真正的格式验证在
            # 下面 openwrt-apk job 里用真 apk add 做。
            if "$APK" adbdump "$f" >/tmp/adb.txt 2>&1; then
              grep -E 'usr/bin/porch|www/luci-static/view|menu\.d|acl\.d' /tmp/adb.txt >/dev/null \
                || { echo "包里没看到预期文件: $f"; exit 1; }
              echo "   adbdump 解析通过，且包含预期文件"
            else
              echo "   ! adbdump 不可用（该 apk 版本可能未编译此 applet），跳过内容检查"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: porch-assets
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.ipk
            dist/*.apk
            dist/SHA256SUMS
          retention-days: 7

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Porch ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.ipk
            dist/*.apk
            dist/SHA256SUMS
          body: |
            ## 安装（一条命令）

            **Linux / OpenWrt / macOS / FreeBSD**
            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            **Windows（PowerShell）**
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
            ```

            脚本会自动识别系统与 CPU 架构、选对应的包、校验 SHA256、装好后实跑一次自检。
            详细说明见 [docs/INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md)。

  smoke:
    name: 真实安装冒烟（${{ matrix.os }}）
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 用发布出来的脚本装一遍
        run: |
          set -e
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo sh install.sh -y --no-service -d /usr/local/bin -c /tmp/porch-smoke/porchconf
            BIN=/usr/local/bin/porch
          else
            sh install.sh -y --no-service --user
            BIN="$HOME/.local/bin/porch"
          fi
          "$BIN" -v
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: 启动并访问 /api/ping
        run: |
          set -e
          "$BIN" -cd /tmp/porch-smoke/porchconf -p 16601 >/tmp/porch.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:16601/api/ping > /tmp/ping.json 2>/dev/null; then break; fi
            sleep 1
          done
          cat /tmp/ping.json
          grep -q '"ok":true' /tmp/ping.json
          grep -q '"service":"porch"' /tmp/ping.json
          pkill -f 'porch -cd' || true

      - name: 断言端口写进配置而不是钉死在服务参数里
        run: |
          set -e
          # 1) -p 必须落到 base.json（这样以后网页里改端口才有效）
          sudo sh install.sh -y --no-service -p 18080 -d /usr/local/bin -c /tmp/porch-smoke/porchconf
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/porch-smoke/porchconf/base.json'))
          assert d.get('adminWebListenPort') == 18080, d
          print('OK: base.json adminWebListenPort =', d['adminWebListenPort'])
          PY

          # 2) 同版本再给一个新端口：应走「只改端口」轻量路径，不重新下载
          sudo sh install.sh -y --no-service -p 18081 -d /usr/local/bin -c /tmp/porch-smoke/porchconf \
            | tee /tmp/port.log
          grep -q '只改管理端口' /tmp/port.log
          grep -q '下载 porch_' /tmp/port.log && { echo "FAIL: 只改端口却又重新下载了"; exit 1; } || true
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/porch-smoke/porchconf/base.json'))
          assert d.get('adminWebListenPort') == 18081, d
          print('OK: base.json adminWebListenPort =', d['adminWebListenPort'])
          PY

      - name: 卸载
        run: sh install.sh --uninstall -y || true

  offline-smoke:
    name: 离线安装冒烟（--file）
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: porch-assets
          path: assets
      - name: 从本地包安装（不联网）
        run: |
          set -e
          V="${GITHUB_REF_NAME#v}"
          sudo sh install.sh --file "assets/porch_${V}_linux_x86_64.tar.gz" \
               -y --no-service -d /usr/local/bin -c /tmp/porch-offline/porchconf
          /usr/local/bin/porch -v
      - name: 起服务验探活
        run: |
          set -e
          /usr/local/bin/porch -cd /tmp/porch-offline/porchconf -p 16602 >/tmp/porch-off.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:16602/api/ping -o /tmp/ping2.json 2>/dev/null && break
            sleep 1
          done
          grep -q '"ok":true' /tmp/ping2.json
          pkill -f 'porch -cd' || true

  openwrt-apk:
    name: OpenWrt 25.12 真装（apk）
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: porch-assets
          path: assets

      # 直接拿官方的 x86/64 rootfs 解到目录里做 chroot —— 这就是一台真机的文件系统，
      # 上面跑的就是 OpenWrt 25.12 自带的 apk，能装进去才算数。
      - name: 准备 OpenWrt 25.12 rootfs
        run: |
          set -e
          V=25.12.6
          curl -fsSL --retry 3 -o /tmp/owrt.tar.gz \
            "https://downloads.openwrt.org/releases/$V/targets/x86/64/openwrt-$V-x86-64-rootfs.tar.gz"
          sudo mkdir -p /mnt/owrt
          sudo tar xzf /tmp/owrt.tar.gz -C /mnt/owrt
          sudo mount --bind /dev /mnt/owrt/dev
          sudo mount -t proc proc /mnt/owrt/proc || true
          sudo chroot /mnt/owrt /bin/sh -c 'cat /etc/openwrt_release | head -5'

      - name: apk add 安装 porch
        run: |
          set -e
          V="${GITHUB_REF_NAME#v}"
          sudo cp "assets/porch_${V}_openwrt_x86_64.apk" /mnt/owrt/tmp/porch.apk
          # --repositories-file /dev/null：不去碰官方源，纯离线装本地包
          sudo chroot /mnt/owrt /bin/sh -c \
            'apk add --repositories-file /dev/null --allow-untrusted /tmp/porch.apk'

      - name: 校验安装结果（文件 / 记账 / 服务）
        run: |
          set -e
          sudo chroot /mnt/owrt /bin/sh -c '
            set -e
            echo "--- 版本 ---"; /usr/bin/porch -v
            echo "--- 文件与权限 ---"; ls -l /usr/bin/porch /etc/init.d/porch /etc/config/porch
            echo "--- 已安装包 ---"; apk list --installed 2>/dev/null | grep -i porch || apk info 2>/dev/null | grep -i porch || echo "(查询命令不适用)"
            echo "--- 我们写的记账文件（apk 必须原样装进去）---"
            cat /lib/apk/packages/porch.list
            echo "--- conffiles 登记 ---"
            cat /lib/apk/packages/porch.conffiles
            cat /lib/apk/packages/porch.conffiles_static
            echo "--- 开机自启（必须存在，否则等于装完不自启）---"
            ls -la /etc/rc.d/ | grep -i porch || true
            test -L /etc/rc.d/S99porch || {
              echo "FAIL: 没有 /etc/rc.d/S99porch"; ls -la /etc/rc.d/; exit 1;
            }
            echo "OK: /etc/rc.d/S99porch -> $(readlink /etc/rc.d/S99porch)"
          '

      - name: 装 LuCI 界面包并断言（菜单 / ACL / 视图文件都要在）
        run: |
          set -e
          V="${GITHUB_REF_NAME#v}"
          sudo cp "assets/luci-app-porch_${V}_all.apk" /mnt/owrt/tmp/luci.apk
          # 这个 rootfs 是纯基础系统，里面没有 luci-base，直接装会被依赖卡住。
          # 先用正常方式装；装不上就退到 --force-broken-world 把文件铺进去，
          # 断言的是「界面文件与菜单真的进系统了」，这正是「装完没有 LuCI」的根因。
          sudo chroot /mnt/owrt /bin/sh -c '
            set -e
            if apk add --repositories-file /dev/null --allow-untrusted /tmp/luci.apk 2>/tmp/apk.err; then
              echo "OK: apk add 完整安装通过（依赖满足）"
            else
              echo "--- 首次安装输出 ---"; cat /tmp/apk.err || true
              echo "退到 --force-broken-world（rootfs 缺 luci-base）"
              apk add --repositories-file /dev/null --allow-untrusted \
                --force-broken-world /tmp/luci.apk
            fi
            echo "--- 界面文件 ---"
            ls -l /usr/share/luci/menu.d/luci-app-porch.json \
                  /usr/share/rpcd/acl.d/luci-app-porch.json \
                  /www/luci-static/resources/view/porch/status.js \
                  /www/luci-static/resources/view/porch/settings.js
            grep -q "admin/services/porch" /usr/share/luci/menu.d/luci-app-porch.json
            grep -q "porch/settings" /usr/share/luci/menu.d/luci-app-porch.json
            # 菜单 JSON 必须是合法 JSON，否则 LuCI 会整个菜单树报错
            if command -v jsonfilter >/dev/null 2>&1; then
              jsonfilter -i /usr/share/luci/menu.d/luci-app-porch.json \
                -e "@[\"admin/services/porch\"].title" >/dev/null
              echo "OK: 菜单 JSON 可解析"
            fi
            # 界面里不该再出现「改了也没用」的假开关
            if grep -q "allow_internet" /www/luci-static/resources/view/porch/settings.js; then
              echo "FAIL: settings.js 里还有未接进启动参数的 allow_internet"
              exit 1
            fi
            echo "OK: 菜单 / ACL / 视图齐全"
          '

      - name: 起服务并访问 /api/ping
        run: |
          set -e
          sudo chroot /mnt/owrt /bin/sh -c \
            '/usr/bin/porch -cd /etc/porch/porchconf -p 16603 >/tmp/porch.log 2>&1 &' || true
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:16603/api/ping -o /tmp/ping3.json 2>/dev/null; then break; fi
            sleep 1
          done
          cat /tmp/ping3.json
          grep -q '"ok":true' /tmp/ping3.json
          grep -q '"service":"porch"' /tmp/ping3.json
          sudo pkill -f 'porch -cd' || true

      - name: apk del 卸载（确认能干净删掉）
        run: |
          set -e
          sudo chroot /mnt/owrt /bin/sh -c 'apk del porch'
          sudo chroot /mnt/owrt /bin/sh -c '
            set -e
            test ! -f /usr/bin/porch && echo "OK: /usr/bin/porch 已删除"
            test ! -f /etc/init.d/porch && echo "OK: /etc/init.d/porch 已删除"
            # rc.d 链接是 post-install 建的，pre-deinstall 必须把它收干净
            if [ -e /etc/rc.d/S99porch ]; then
              echo "FAIL: 卸载后残留 /etc/rc.d/S99porch"; ls -la /etc/rc.d/ | grep -i porch; exit 1
            fi
            echo "OK: 没有残留 rc.d 链接"
            # conffiles 里的 /etc/config/porch 按 apk 规则应保留
            [ -f /etc/config/porch ] && echo "OK: conffile /etc/config/porch 按规则保留" || echo "(conffile 已被一并删除)"
          '
