<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#eef2f8">
<meta name="description" content="Porch 门廊 · 让家里的服务安全出门：动态域名、HTTPS 证书、反向代理，一处配置，开箱即用。">
<title>Porch 门廊 · 内网服务门面</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234cb8f0'/%3E%3Cstop offset='.55' stop-color='%236d8bf5'/%3E%3Cstop offset='1' stop-color='%237b5cf0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='48' height='48' rx='13' fill='url(%23g)'/%3E%3Cpath fill='%23fff' fill-rule='evenodd' d='M13.6 38V23.6a10.4 10.4 0 0120.8 0V38h-5V23.6a5.4 5.4 0 00-10.8 0V38z'/%3E%3Cpath stroke='%23fff' stroke-width='3.1' stroke-linecap='round' d='M9.8 38h28.4'/%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- 图标精灵：1.7px 线性描边，无 emoji -->
<svg style="display:none" aria-hidden="true">
  <symbol id="i-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6l7-3z"/><path d="M9.2 12.2l2 2 3.6-3.8"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6M4 4l5 5"/></symbol>
  <symbol id="i-log" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M7 9h10M7 13h10M7 17h6"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 008 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H2a2 2 0 110-4h.1A1.6 1.6 0 004.6 8a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V2a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H22a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8V4z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  <symbol id="i-server" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><path d="M6 7h.01M6 17h.01"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M5 12.5a10 10 0 0114 0"/><path d="M8.5 16a5 5 0 017 0"/><path d="M12 20h.01"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2.5-7 4 14 2.5-7H21"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5"/><path d="M20 15v5h-5"/><path d="M15 4h5v5"/><path d="M9 20H4v-5"/></symbol>
  <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></symbol>
  <symbol id="i-memory" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 7V4M12 7V4M17 7V4M7 20v-3M12 20v-3M17 20v-3"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.5 6.5a8 8 0 1011 0"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l9 16H3l9-16z"/><path d="M12 9v5M12 17h.01"/></symbol>
  <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 18a8 8 0 1116 0"/><path d="M12 18l4-6"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-porch" viewBox="0 0 24 24"><path d="M5 20V9.6a7 7 0 0114 0V20"/><path d="M3 20h18"/><path d="M12 6.4V20" opacity=".4"/><circle cx="12" cy="13.4" r="1.1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13"/><path d="M13 6l6 6-6 6"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="8" r="4.2"/><path d="M11 11l9 9"/><path d="M17 17l2-2M20 20l2-2"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><path d="M12 7.6h.01"/></symbol>
</svg>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>

<!-- 顶部加载进度（请求进行中时滑动，纯 CSS 动画，不阻塞渲染） -->
<div id="topProgress" class="top-progress"></div>

<!-- 登录 -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="logo logo-anim">
      <svg class="logo-svg" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="porchGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4cb8f0"/><stop offset="0.55" stop-color="#6d8bf5"/><stop offset="1" stop-color="#7b5cf0"/>
          </linearGradient>
          <linearGradient id="porchGloss" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <rect width="48" height="48" rx="14" fill="url(#porchGrad)"/>
        <rect width="48" height="26" rx="14" fill="url(#porchGloss)" opacity=".38"/>
        <path class="logo-frame" fill="#fff" fill-rule="evenodd" d="M13.6 38V23.6a10.4 10.4 0 0120.8 0V38h-5V23.6a5.4 5.4 0 00-10.8 0V38z"/>
        <path class="logo-step" stroke="#fff" stroke-width="3.1" stroke-linecap="round" d="M9.8 38h28.4"/>
        <circle class="logo-dot" cx="24" cy="28" r="2.2" fill="#fff"/>
      </svg>
    </div>
    <h2>Porch 门廊</h2>
    <p class="desc">让家里的服务安全出门 · 动态域名 / HTTPS / 反向代理</p>
    <div id="loginErr" class="login-err"></div>
    <div class="field">
      <label>账号</label>
      <input id="loginUser" type="text" autocomplete="username" placeholder="666">
    </div>
    <div class="field">
      <label>密码</label>
      <input id="loginPass" type="password" autocomplete="current-password" placeholder="666">
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px" onclick="doLogin()">
      <svg class="icon icon-sm"><use href="#i-check"/></svg> 登录
    </button>
    <p class="desc" style="margin:14px 0 0;text-align:center">默认账号 666 · 密码 666，登录后可在「系统设置」修改</p>
  </div>
</div>

<!-- 主界面 -->
<div id="app" class="layout hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg class="logo-svg" viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="porchGradSm" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4cb8f0"/><stop offset="0.55" stop-color="#6d8bf5"/><stop offset="1" stop-color="#7b5cf0"/>
            </linearGradient>
            <linearGradient id="porchGlossSm" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <rect width="48" height="48" rx="14" fill="url(#porchGradSm)"/>
          <rect width="48" height="26" rx="14" fill="url(#porchGlossSm)" opacity=".38"/>
          <path fill="#fff" fill-rule="evenodd" d="M13.6 38V23.6a10.4 10.4 0 0120.8 0V38h-5V23.6a5.4 5.4 0 00-10.8 0V38z"/>
          <path stroke="#fff" stroke-width="3.1" stroke-linecap="round" d="M9.8 38h28.4"/>
          <circle class="logo-dot" cx="24" cy="28" r="2.2" fill="#fff"/>
        </svg>
      </div>
      <div class="brand-text"><b>Porch</b><span id="versionText">门廊</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <span id="footInfo">未连接</span>
      <button class="btn btn-sm btn-ghost" onclick="doLogout()" title="退出登录">
        <svg class="icon icon-sm"><use href="#i-logout"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-title">
        <h1 id="pageTitle">概览</h1>
        <div class="sub" id="pageSub">运行状态总览</div>
      </div>
      <div class="topbar-actions">
        <span id="healthBadge" class="health-badge ok" title="服务健康状态">
          <svg class="icon icon-sm"><use href="#i-activity"/></svg><span id="healthText">健康</span>
        </span>
        <button class="btn btn-ghost btn-sm" id="densityBtn" onclick="toggleDensity()" title="切换紧凑 / 舒适密度">紧凑</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleFullscreen()" title="全屏显示">
          <svg class="icon icon-sm"><use href="#i-expand"/></svg><span class="btn-label">全屏</span>
        </button>
        <button class="btn btn-ghost btn-sm" onclick="loadState()" title="重新读取一次数据">
          <svg class="icon icon-sm"><use href="#i-refresh"/></svg><span class="btn-label">刷新</span>
        </button>
        <button class="btn btn-primary btn-sm" onclick="reloadService()" title="让最新配置立即生效（随时点都安全）">
          <svg class="icon icon-sm"><use href="#i-bolt"/></svg><span class="btn-label">应用更改</span>
        </button>
      </div>
    </div>
    <div id="content"></div>
  </main>
</div>

<!-- 弹窗 -->
<div id="mask" class="mask" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">编辑</h3>
      <button class="btn btn-icon btn-ghost close" onclick="closeModal()">
        <svg class="icon icon-sm"><use href="#i-x"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="modalSave">保存</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="./app.js"></script>
</body>
</html>
